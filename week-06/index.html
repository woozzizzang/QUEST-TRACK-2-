<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 날씨</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2f6fdf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="동네 날씨">
<style>
  :root {
    --bg: #eef4fb;
    --card: #ffffff;
    --text: #1d2733;
    --sub: #5b6b7d;
    --accent: #2f6fdf;
    --error: #c2412d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121820;
      --card: #1c2531;
      --text: #e8eef5;
      --sub: #9aabbd;
      --accent: #6ea2ff;
      --error: #ff8a73;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 24px;
    padding: clamp(20px, 6vw, 36px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    text-align: center;
  }
  .place { margin: 0; font-size: clamp(18px, 5vw, 22px); font-weight: 600; }
  .updated { margin: 4px 0 0; font-size: 13px; color: var(--sub); }
  .icon { font-size: clamp(56px, 18vw, 80px); line-height: 1.1; margin-top: 16px; }
  .temp { font-size: clamp(56px, 20vw, 88px); font-weight: 700; line-height: 1; margin-top: 4px; }
  .desc { font-size: clamp(24px, 7vw, 32px); font-weight: 600; margin-top: 8px; }
  .minmax {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 20px;
    font-size: 15px;
    color: var(--sub);
  }
  .minmax b { color: var(--text); font-weight: 600; }
  .message { margin: 32px 0 8px; font-size: 17px; line-height: 1.5; }
  .message.error { color: var(--error); }
  .reason { margin: 0; font-size: 14px; color: var(--sub); line-height: 1.5; }
  .spinner {
    width: 40px; height: 40px; margin: 32px auto 0;
    border: 4px solid var(--bg); border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  button {
    margin-top: 20px;
    padding: 12px 24px;
    font: inherit;
    font-size: 16px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .offline {
    margin: 16px 0 0;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--bg);
    color: var(--error);
    font-size: 14px;
    line-height: 1.5;
  }
  .offline button { margin-top: 8px; padding: 8px 18px; font-size: 14px; }
  /* 움직이는 온도계 */
  .temp-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 4vw, 20px);
    margin-top: 4px;
  }
  .thermo-wrap { position: relative; flex: none; }
  .thermo {
    display: block;
    width: clamp(76px, 23vw, 100px);
    height: auto;
    touch-action: none; /* 끌 때 화면이 같이 움직이지 않게 */
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .thermo:active { cursor: grabbing; }
  .thermo .glass { fill: var(--bg); stroke: var(--sub); stroke-opacity: 0.35; stroke-width: 2; }
  .thermo .glass-in { fill: var(--bg); }
  .thermo .shine { fill: #fff; opacity: 0.35; pointer-events: none; }
  .thermo .ticks line { stroke: var(--sub); stroke-opacity: 0.5; stroke-width: 1.5; }
  .thermo .ticks text { fill: var(--sub); font-size: 13px; }
  .thermo .marks line { stroke-width: 2.5; stroke-linecap: round; }
  .thermo .marks text { font-size: 14px; font-weight: 700; }
  .thermo .marks .hi { stroke: #e8572f; fill: #e8572f; }
  .thermo .marks .lo { stroke: #3b7ddd; fill: #3b7ddd; }
  .thermo circle.bubble { fill: #fff; opacity: 0.7; }
  .thermo-tip {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 6px);
    transform: translateX(-30%);
    width: max-content;
    max-width: min(240px, 70vw);
    padding: 8px 12px;
    border-radius: 12px;
    background: var(--text);
    color: var(--card);
    font-size: 13px;
    line-height: 1.4;
    text-align: left;
    pointer-events: none;
    z-index: 2;
    animation: tipIn 0.18s ease-out;
  }
  @keyframes tipIn { from { opacity: 0; transform: translate(-30%, 6px); } }
  .source { margin-top: 24px; font-size: 12px; color: var(--sub); }
  .source a { color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <h1 class="place">평택시</h1>
  <p class="updated" id="updated"></p>

  <!-- 불러오는 중 -->
  <section id="loading">
    <div class="spinner" aria-hidden="true"></div>
    <p class="message">날씨를 불러오는 중이에요…</p>
  </section>

  <!-- 못 받아 왔을 때 -->
  <section id="error" hidden>
    <p class="message error">날씨를 받아 오지 못했어요.</p>
    <p class="reason" id="reason"></p>
    <button id="retry" type="button">다시 불러오기</button>
  </section>

  <!-- 받아 왔을 때 -->
  <section id="weather" hidden>
    <!-- 새 정보를 못 받아 와서 저장해 둔 정보를 보여 줄 때만 보임 -->
    <div class="offline" id="offline" hidden>
      <div id="offlineText"></div>
      <button id="retry2" type="button">다시 불러오기</button>
    </div>
    <div class="icon" id="icon" aria-hidden="true"></div>
    <div class="temp-row">
      <!-- 움직이는 온도계: 누르면 통 튀고, 위아래로 끌면 액체가 손가락을 따라옴 -->
      <div class="thermo-wrap">
        <svg class="thermo" id="thermo" viewBox="-18 0 114 210" role="img" aria-label="지금 기온 온도계">
          <defs>
            <clipPath id="thermoInside">
              <rect x="22" y="12" width="16" height="160" rx="8"/>
              <circle cx="30" cy="178" r="16"/>
            </clipPath>
          </defs>
          <!-- 유리관 -->
          <rect class="glass" x="18" y="8" width="24" height="168" rx="12"/>
          <circle class="glass" cx="30" cy="178" r="20"/>
          <g clip-path="url(#thermoInside)">
            <rect class="glass-in" x="0" y="0" width="60" height="210"/>
            <path id="thermoLiquid" d=""/>
            <g id="thermoBubbles"></g>
          </g>
          <!-- 눈금 (-20° ~ 40°, 10° 마다) -->
          <g id="thermoTicks" class="ticks"></g>
          <!-- 오늘 최고 · 최저 표시 -->
          <g id="thermoMarks" class="marks"></g>
          <rect class="shine" x="25" y="18" width="4" height="140" rx="2"/>
        </svg>
        <div class="thermo-tip" id="thermoTip" hidden></div>
      </div>
      <div class="temp" id="temp"></div>
    </div>
    <div class="desc" id="desc"></div>
    <div class="minmax">
      <span>최고 <b id="max"></b></span>
      <span>최저 <b id="min"></b></span>
    </div>
  </section>

  <p class="source"><a href="battle.html">⚔️ 친구 동네와 날씨 카드 배틀</a></p>
  <p class="source">날씨 정보: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
</main>

<script>
  // 평택시 위치 (Open-Meteo 지명 검색에서 찾은 값)
  const LAT = 36.99472;
  const LON = 127.08889;
  const TIMEOUT_MS = 10000; // 10초 안에 답이 없으면 실패로 봄

  const URL_API = 'https://api.open-meteo.com/v1/forecast'
    + `?latitude=${LAT}&longitude=${LON}`
    + '&current=temperature_2m,weather_code,is_day'
    + '&daily=temperature_2m_max,temperature_2m_min'
    + '&timezone=Asia%2FSeoul&forecast_days=1';

  // 날씨 번호(WMO) → 한국어 낱말과 그림
  const WEATHER = {
    0: ['맑음', '☀️', '🌙'],
    1: ['대체로 맑음', '🌤️', '🌙'],
    2: ['구름 조금', '⛅', '☁️'],
    3: ['흐림', '☁️', '☁️'],
    45: ['안개', '🌫️'], 48: ['짙은 안개', '🌫️'],
    51: ['약한 이슬비', '🌦️'], 53: ['이슬비', '🌦️'], 55: ['강한 이슬비', '🌧️'],
    56: ['어는 이슬비', '🌧️'], 57: ['강한 어는 이슬비', '🌧️'],
    61: ['약한 비', '🌦️'], 63: ['비', '🌧️'], 65: ['강한 비', '🌧️'],
    66: ['어는 비', '🌧️'], 67: ['강한 어는 비', '🌧️'],
    71: ['약한 눈', '🌨️'], 73: ['눈', '🌨️'], 75: ['강한 눈', '❄️'],
    77: ['싸락눈', '🌨️'],
    80: ['약한 소나기', '🌦️'], 81: ['소나기', '🌧️'], 82: ['강한 소나기', '⛈️'],
    85: ['약한 눈 소나기', '🌨️'], 86: ['강한 눈 소나기', '❄️'],
    95: ['뇌우', '⛈️'], 96: ['우박을 동반한 뇌우', '⛈️'], 99: ['강한 우박 뇌우', '⛈️'],
  };

  const $ = id => document.getElementById(id);
  const SAVE_KEY = 'week06-last-weather'; // 마지막으로 받은 날씨를 이 이름으로 저장
  window.appState = 'loading'; // 확인 도구가 읽는 값: loading / ok / saved / error

  function show(which) {
    for (const s of ['loading', 'error', 'weather']) $(s).hidden = s !== which;
    window.appState = which === 'weather' ? 'ok' : which;
  }

  const round = n => Math.round(n) + '°';

  // 받아 온 날씨가 쓸 수 있는 모양인지 봄
  const isGood = d => d && d.current && typeof d.current.temperature_2m === 'number'
    && d.daily && Array.isArray(d.daily.temperature_2m_max) && Array.isArray(d.daily.temperature_2m_min);

  // 날씨를 화면에 그림
  function draw(data) {
    const cur = data.current;
    const daily = data.daily;
    const w = WEATHER[cur.weather_code] || [`알 수 없는 날씨 (${cur.weather_code}번)`, '🌡️'];
    const isNight = cur.is_day === 0;
    $('icon').textContent = (isNight && w[2]) || w[1];
    $('temp').textContent = round(cur.temperature_2m);
    $('desc').textContent = w[0];
    $('max').textContent = round(daily.temperature_2m_max[0]);
    $('min').textContent = round(daily.temperature_2m_min[0]);
    thermo.set(cur.temperature_2m, daily.temperature_2m_min[0], daily.temperature_2m_max[0]);
  }

  // ── 움직이는 온도계 ──
  const thermo = (() => {
    const T_MIN = -20, T_MAX = 40;      // 온도계 눈금 범위
    const Y_TOP = 20, Y_BOTTOM = 160;   // 그 범위가 그려지는 높이 (svg 안 좌표)
    const svg = $('thermo');
    const liquid = $('thermoLiquid');
    const bubbleBox = $('thermoBubbles');
    const tip = $('thermoTip');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const NS = 'http://www.w3.org/2000/svg';

    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const tToY = t => Y_BOTTOM - (clamp(t, T_MIN, T_MAX) - T_MIN) / (T_MAX - T_MIN) * (Y_BOTTOM - Y_TOP);
    const yToT = y => T_MIN + (Y_BOTTOM - y) / (Y_BOTTOM - Y_TOP) * (T_MAX - T_MIN);

    // 기온 → 색 (추우면 파랑, 따뜻하면 주황, 더우면 빨강)
    const STOPS = [[-10, [59, 125, 221]], [5, [76, 176, 224]], [15, [242, 163, 58]], [27, [232, 87, 47]], [35, [208, 38, 42]]];
    function colorFor(t) {
      if (t <= STOPS[0][0]) return `rgb(${STOPS[0][1]})`;
      for (let i = 1; i < STOPS.length; i++) {
        const [t1, c1] = STOPS[i];
        if (t <= t1) {
          const [t0, c0] = STOPS[i - 1];
          const k = (t - t0) / (t1 - t0);
          return `rgb(${c0.map((c, j) => Math.round(c + (c1[j] - c) * k))})`;
        }
      }
      return `rgb(${STOPS[STOPS.length - 1][1]})`;
    }

    // 눈금 그리기
    const ticks = $('thermoTicks');
    for (let t = T_MIN; t <= T_MAX; t += 10) {
      const y = tToY(t);
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', 44); l.setAttribute('x2', t % 20 === 0 ? 52 : 49);
      l.setAttribute('y1', y); l.setAttribute('y2', y);
      ticks.appendChild(l);
      if (t % 20 === 0) {
        const tx = document.createElementNS(NS, 'text');
        tx.setAttribute('x', 54); tx.setAttribute('y', y + 4.5);
        tx.textContent = t + '°';
        ticks.appendChild(tx);
      }
    }

    // 움직임 상태
    const s = {
      temp: null, lo: null, hi: null,
      level: T_MIN - 5,  // 지금 그려진 액체 높이(기온 단위). 처음엔 바닥에서 차오름
      vel: 0,
      target: T_MIN - 5,
      amp: 1.5,          // 출렁임 크기
      phase: 0,
      dragging: false,
      bubbles: [],
      taps: 0,
    };
    window.thermoState = s; // 확인 도구가 읽는 값

    function drawMarks() {
      const g = $('thermoMarks');
      g.innerHTML = '';
      for (const [cls, t, label] of [['hi', s.hi, '최고'], ['lo', s.lo, '최저']]) {
        if (typeof t !== 'number') continue;
        const y = tToY(t);
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('class', cls);
        l.setAttribute('x1', 10); l.setAttribute('x2', 16); l.setAttribute('y1', y); l.setAttribute('y2', y);
        g.appendChild(l);
        const tx = document.createElementNS(NS, 'text');
        tx.setAttribute('class', cls);
        tx.setAttribute('x', 8); tx.setAttribute('text-anchor', 'end');
        // 최고·최저가 너무 가까우면 글자가 겹치지 않게 벌림
        const gap = Math.abs(tToY(s.hi) - tToY(s.lo));
        const shift = gap < 16 ? (cls === 'hi' ? -(16 - gap) / 2 : (16 - gap) / 2) : 0;
        tx.setAttribute('y', y + 5 + shift);
        tx.textContent = Math.round(t) + '°';
        g.appendChild(tx);
      }
    }

    function render() {
      const y = tToY(s.level);
      // 물결치는 윗면
      let d = `M0 210 L0 ${y}`;
      for (let x = 0; x <= 60; x += 4) {
        d += ` L${x} ${(y + Math.sin(s.phase + x / 6) * s.amp).toFixed(2)}`;
      }
      d += ' L60 210 Z';
      liquid.setAttribute('d', d);
      liquid.setAttribute('fill', colorFor(s.level));
    }

    function addBubbles(n) {
      for (let i = 0; i < n; i++) {
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('class', 'bubble');
        const b = { el: c, x: 24 + Math.random() * 12, y: 186 - Math.random() * 10, r: 1.5 + Math.random() * 2.5, sp: 0.8 + Math.random() * 1.2 };
        c.setAttribute('r', b.r);
        bubbleBox.appendChild(c);
        s.bubbles.push(b);
      }
    }

    let last = 0;
    function frame(now) {
      const dt = Math.min(0.05, (now - (last || now)) / 1000);
      last = now;
      // 용수철처럼 목표 높이로 다가감 → 살짝 넘쳤다가 돌아옴
      const acc = (s.target - s.level) * 40 - s.vel * 7;
      s.vel += acc * dt;
      s.level += s.vel * dt;
      // 출렁임: 움직이면 커지고 가만히 있으면 작게 남음
      s.amp += (Math.min(6, 1 + Math.abs(s.vel) * 0.15) - s.amp) * dt * 2.5;
      s.phase += dt * (3 + Math.abs(s.vel) * 0.2);
      // 거품: 위로 올라가다가 액체 윗면에서 사라짐
      const top = tToY(s.level);
      s.bubbles = s.bubbles.filter(b => {
        b.y -= b.sp * 60 * dt;
        b.x += Math.sin(b.y / 6) * 0.3;
        if (b.y < top + 2) { b.el.remove(); return false; }
        b.el.setAttribute('cx', b.x.toFixed(2));
        b.el.setAttribute('cy', b.y.toFixed(2));
        return true;
      });
      render();
      requestAnimationFrame(frame);
    }

    let tipTimer = 0;
    function showTip(text, stay) {
      tip.textContent = text;
      tip.hidden = false;
      clearTimeout(tipTimer);
      if (!stay) tipTimer = setTimeout(() => { tip.hidden = true; }, 2500);
    }
    const nowText = () => `지금 ${Math.round(s.temp)}°, 오늘 최저 ${Math.round(s.lo)}° ~ 최고 ${Math.round(s.hi)}°`;

    // 손가락(마우스) 위치 → 온도계 안의 기온
    function pointerTemp(e) {
      const r = svg.getBoundingClientRect();
      const y = (e.clientY - r.top) / r.height * 210;
      return clamp(yToT(y), T_MIN, T_MAX);
    }

    svg.addEventListener('pointerdown', e => {
      if (s.temp === null) return;
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      s.dragging = true;
      s.taps++;
      s.vel += 60;          // 통 튀어 오름
      s.amp = 6;
      addBubbles(8);
      showTip(nowText(), true);
    });
    svg.addEventListener('pointermove', e => {
      if (!s.dragging) return;
      s.target = pointerTemp(e);
      if (reduceMotion) { s.level = s.target; render(); }
      else if (Math.random() < 0.3) addBubbles(1);
      showTip(`손가락 위치 ${Math.round(s.target)}° · ${nowText()}`, true);
    });
    const release = () => {
      if (!s.dragging) return;
      s.dragging = false;
      s.target = s.temp;    // 지금 기온으로 돌아감
      if (reduceMotion) { s.level = s.temp; render(); }
      showTip(nowText(), false);
    };
    svg.addEventListener('pointerup', release);
    svg.addEventListener('pointercancel', release);

    if (!reduceMotion) requestAnimationFrame(frame);

    return {
      set(temp, lo, hi) {
        s.temp = temp; s.lo = lo; s.hi = hi;
        s.target = temp;
        svg.setAttribute('aria-label', `온도계: ${nowText()}`);
        drawMarks();
        if (reduceMotion) { s.level = temp; render(); }
      },
    };
  })();

  // "11월 14일 오전 11:30" 처럼 바꿈 (오늘이면 "오늘 오전 11:30")
  function whenText(ms) {
    const d = new Date(ms);
    const now = new Date();
    const time = d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
    const sameDay = d.toDateString() === now.toDateString();
    return sameDay ? `오늘 ${time}` : `${d.getMonth() + 1}월 ${d.getDate()}일 ${time}`;
  }

  function save(data) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ savedAt: Date.now(), data })); } catch {}
  }
  function loadSaved() {
    try {
      const s = JSON.parse(localStorage.getItem(SAVE_KEY));
      return s && typeof s.savedAt === 'number' && isGood(s.data) ? s : null;
    } catch { return null; }
  }

  // 새 날씨를 못 받아 왔을 때: 저장해 둔 게 있으면 그걸 언제 받은 건지와 같이 보여 주고, 없으면 까닭만 보여 줌
  function fail(reason) {
    const saved = loadSaved();
    if (saved) {
      draw(saved.data);
      $('updated').textContent = `${whenText(saved.savedAt)}에 받은 정보`;
      $('offlineText').textContent = `${reason} 그래서 ${whenText(saved.savedAt)}에 마지막으로 받은 날씨를 보여 줘요.`;
      $('offline').hidden = false;
      show('weather');
      window.appState = 'saved';
    } else {
      $('reason').textContent = reason;
      $('updated').textContent = '';
      show('error');
    }
  }

  async function loadWeather() {
    show('loading');
    $('updated').textContent = '';
    $('offline').hidden = true;

    if (!navigator.onLine) {
      fail('인터넷에 연결되어 있지 않아요.');
      return;
    }

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
    let data;
    try {
      const res = await fetch(URL_API, { signal: controller.signal, cache: 'no-store' });
      if (!res.ok) {
        fail(`날씨 서버가 답을 주지 않았어요. (응답 번호 ${res.status})`);
        return;
      }
      data = await res.json();
    } catch (e) {
      if (e.name === 'AbortError') fail(`${TIMEOUT_MS / 1000}초를 기다려도 날씨 서버가 답하지 않았어요.`);
      else fail('날씨 서버에 닿지 못했어요. 인터넷 연결을 확인해 주세요.');
      return;
    } finally {
      clearTimeout(timer);
    }

    if (!isGood(data)) {
      fail('받아 온 날씨 정보의 모양이 예상과 달라요.');
      return;
    }

    save(data);
    draw(data);
    $('updated').textContent = `${whenText(Date.now())}에 받은 정보`;
    show('weather');
  }

  $('retry').addEventListener('click', loadWeather);
  $('retry2').addEventListener('click', loadWeather);
  // 인터넷이 다시 연결되면 저절로 새로 받아 옴
  window.addEventListener('online', () => { if (window.appState !== 'ok') loadWeather(); });
  loadWeather();

  // 서비스 워커 등록 (폰에 설치하고, 인터넷 없이도 앱이 열리게 함)
  // file:// 로 열었을 때는 쓸 수 없어서 건너뜀
  window.swState = 'none';
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js')
      .then(() => navigator.serviceWorker.ready)
      .then(() => { window.swState = 'ready'; })
      .catch(e => { window.swState = 'failed: ' + e.message; });
  }
</script>
</body>
</html>
