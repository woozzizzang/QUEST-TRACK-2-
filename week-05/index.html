<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>숲속 금화 모으기</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #14201a;
    color: #eee;
    font-family: "Malgun Gothic", sans-serif;
  }
  canvas {
    border: 4px solid #24362b;
    border-radius: 8px;
    image-rendering: pixelated;
  }
  p { margin: 10px 0 0; color: #aaa; font-size: 14px; }
  .credits { font-size: 12px; color: #888; }
  .credits a { color: #9cc; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<p>← → 이동 · 스페이스 점프 · 슬라임을 피해서 금화를 모두 모으기 · R 처음부터</p>
<p class="credits">
  초록·파랑·노랑·빨강 슬라임 그림(4개 모두): Animated Slime by Calciumtrice (CC-BY 3.0)
  <a href="https://opengameart.org/content/animated-slime">https://opengameart.org/content/animated-slime</a>
</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const SCALE = 3;            // 픽셀 그림을 3배로 키워서 그림
const VIEW_W = 320, VIEW_H = 180;   // 한 화면에 보이는 크기 (3배 하기 전)
const H = 272;              // 숲 전체 높이 (배경 그림 높이와 같음)
const TILE = 16;            // 땅 타일 한 칸 16×16
const WORLD_W = 1440;       // 옆으로 이어지는 숲 너비 (화면 세 개)

// ===== 에셋 불러오기 =====
const SLIME_COLORS = ['green', 'blue', 'yellow', 'red'];
const SLIME_ANIMS = {       // 슬라임 4색 모두 같음 (drop.json 값). 32×32 프레임이 가로 한 줄
  idle:   { frames: 10, fps: 10, loop: true },
  walk:   { frames: 10, fps: 10, loop: true },
  attack: { frames: 10, fps: 14, loop: false },
  death:  { frames: 10, fps: 10, loop: false },
  wave:   { frames: 10, fps: 10, loop: true },
};
const SLIME_FRAME = 32;

// 영웅 기사 (drop.json 값). 134×83 프레임이 가로 한 줄, 그림은 오른쪽을 보고 있음
const HERO_ANIMS = {
  idle:    { frames: 11, fps: 10, loop: true,  file: 'hero-knight_idle.png' },
  run:     { frames: 8,  fps: 14, loop: true,  file: 'hero-knight_run.png' },
  jump:    { frames: 3,  fps: 10, loop: true,  file: 'hero-knight_jump.png' },
  fall:    { frames: 3,  fps: 10, loop: true,  file: 'hero-knight_fall.png' },
  attack:  { frames: 7,  fps: 14, loop: false, file: 'hero-knight_attack.png' },
  attack2: { frames: 7,  fps: 14, loop: false, file: 'hero-knight_attack_2.png' },
  hit:     { frames: 4,  fps: 12, loop: false, file: 'hero-knight_hit.png' },
  death:   { frames: 11, fps: 10, loop: false, file: 'hero-knight_death.png' },
};
const HERO_FW = 134, HERO_FH = 83;
const HERO_FOOT_X = 47, HERO_FOOT_Y = 80;   // 한 프레임 안에서 기사 발밑 가운데 자리
const HERO_SIZE = 0.5;      // 그림이 숲에 비해 커서 절반 크기로 그림 (1 로 하면 원래 크기)

const IMAGE_FILES = {
  'bg-back':   'assets/images/forest-parallax-back_back.png',     // 160×272, 천천히 (0.25)
  'bg-middle': 'assets/images/forest-parallax-back_middle.png',   // 384×272, 조금 빠르게 (0.7)
  'ground':    'assets/images/forest-ground-tiles.png',           // 176×96, 한 칸 16×16
};
for (const color of SLIME_COLORS) {
  for (const anim of Object.keys(SLIME_ANIMS)) {
    IMAGE_FILES[`${color}-${anim}`] = `assets/images/${color}-slime_${anim}.png`;
  }
}
for (const [anim, a] of Object.entries(HERO_ANIMS)) {
  IMAGE_FILES[`hero-${anim}`] = `assets/images/${a.file}`;
}
const PARALLAX = [
  { key: 'bg-back',   w: 160, speed: 0.25 },
  { key: 'bg-middle', w: 384, speed: 0.7 },
];

const images = {};
function loadImage(key, src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => { images[key] = img; resolve(); };
    img.onerror = () => reject(src);
    img.src = src;
  });
}
function loadAllImages() {
  return Promise.all(Object.entries(IMAGE_FILES).map(([key, src]) => loadImage(key, src)));
}

// 소리: 못 찾은 파일은 soundErrors 에 모아 화면에 보여 줌
const soundErrors = [];
function loadSound(src) {
  const a = new Audio(src);
  a.addEventListener('error', () => soundErrors.push(src));
  return a;
}
const sounds = {
  jump: loadSound('assets/sounds/jump.wav'),
  coin: loadSound('assets/sounds/coin.wav'),
  bgm:  loadSound('assets/sounds/stage-1.ogg'),
};
sounds.bgm.loop = true;     // 배경음악은 끝나면 처음부터 다시
sounds.bgm.volume = 0.4;
function playSfx(name) {
  const s = sounds[name].cloneNode();
  s.volume = 0.6;
  s.play().catch(() => {});
}

// 금화: 받은 에셋에 금화 그림이 없어서 8×8 픽셀 동전을 코드로 그림
const COIN_PIXELS = [
  '..####..',
  '.#yyyy#.',
  '#ywyyyo#',
  '#ywyyyo#',
  '#yyyyyo#',
  '#yyyyoo#',
  '.#oooo#.',
  '..####..',
];
const COIN_COLORS = { '#': '#8a5a00', 'y': '#ffd23f', 'w': '#fff7c0', 'o': '#e09a00' };
const coinImage = document.createElement('canvas');
coinImage.width = coinImage.height = 8;
COIN_PIXELS.forEach((row, y) => [...row].forEach((ch, x) => {
  if (ch === '.') return;
  const g = coinImage.getContext('2d');
  g.fillStyle = COIN_COLORS[ch];
  g.fillRect(x, y, 1, 1);
}));

// ===== 땅과 발판 =====
const GROUND_TOP = H - 4 * TILE;          // 땅 위 (풀이 시작하는 곳)
// 발판: [가로 칸, 세로 칸, 길이(칸)]  아래에서 뛰어 올라가 위에 설 수 있음
const PLATFORMS = [
  [8, 10, 4], [14, 7, 3], [22, 10, 4], [34, 10, 3], [39, 7, 4],
  [50, 10, 4], [56, 7, 3], [68, 10, 4], [75, 8, 4],
].map(([tx, ty, w]) => ({ x: tx * TILE, y: ty * TILE, w: w * TILE }));

// 땅과 발판은 한 번만 그려 두고 매 화면마다 통째로 붙임
// 타일셋 왼쪽 덩어리(가로 1~4칸, 세로 0~4칸): 0줄 풀 끝, 1줄 풀, 2~4줄 돌과 흙
let worldCanvas;
function buildWorldCanvas() {
  worldCanvas = document.createElement('canvas');
  worldCanvas.width = WORLD_W;
  worldCanvas.height = H;
  const g = worldCanvas.getContext('2d');
  g.imageSmoothingEnabled = false;
  for (let x = 0; x < WORLD_W; x += 4 * TILE) {
    g.drawImage(images.ground, 1 * TILE, 0, 4 * TILE, 5 * TILE, x, GROUND_TOP - TILE, 4 * TILE, 5 * TILE);
  }
  for (const pl of PLATFORMS) {
    const n = pl.w / TILE;
    for (let i = 0; i < n; i++) {
      const col = i === 0 ? 1 : i === n - 1 ? 4 : 2 + (i % 2);   // 양 끝은 끝 칸, 가운데는 2·3칸 번갈아
      g.drawImage(images.ground, col * TILE, 0, TILE, 2 * TILE, pl.x + i * TILE, pl.y - TILE, TILE, 2 * TILE);
    }
  }
}

// ===== 금화 =====
// [가로 칸, 세로 칸] 칸 한가운데에 놓임
const COIN_SPOTS = [
  [5, 12], [10, 9], [15, 6], [20, 12], [24, 9], [35, 9], [41, 6],
  [46, 12], [52, 9], [57, 6], [70, 9], [77, 7], [85, 12],
];
let coins = [];

// ===== 기사 =====
const KB = { w: 12, h: 24 };    // 기사 몸 크기 (부딪힘 판정용, 절반 크기 그림의 몸통에 맞춤)
const SPEED = 90, GRAVITY = 900, JUMP = -320, MAX_FALL = 400;
const START_X = 2 * TILE;
const START_SAFE = 2;       // 시작(또는 R)하고 2초 동안은 슬라임이 공격하지 않음 (시작 직후 보호)
let knight;

// ===== 슬라임 =====
// 색마다 움직임이 다름: 초록 느림, 파랑 빠름, 노랑 통통 뜀, 빨강 가까이 오면 달려듦
const SLIME_SETUP = [
  { color: 'green',  x: 330,  minX: 250,  maxX: 430,  speed: 20 },
  { color: 'blue',   x: 640,  minX: 560,  maxX: 780,  speed: 45 },
  { color: 'yellow', x: 930,  minX: 850,  maxX: 1060, speed: 28, hop: true },
  { color: 'red',    x: 1220, minX: 1130, maxX: 1380, speed: 22, charge: true },
];
let slimes = [];

// ===== 게임 상태 =====
let state = 'play';         // play: 하는 중 / over: 하트를 다 잃음 / won: 금화를 다 모음
let playTime = 0;

function resetGame() {
  state = 'play';
  playTime = 0;
  knight = { x: START_X, y: GROUND_TOP - KB.h, vx: 0, vy: 0, onGround: true, lives: 3, hurt: 0, knock: 0,
             face: 1, anim: 'idle', animTime: 0, safe: START_SAFE };
  coins = COIN_SPOTS.map(([tx, ty]) => ({ x: tx * TILE + TILE / 2, y: ty * TILE + TILE / 2, taken: false }));
  slimes = SLIME_SETUP.map(s => ({
    ...s, y: GROUND_TOP, vy: 0, dir: -1,
    anim: 'walk', animTime: 0, hopTimer: 1, cooldown: 0, waveTime: 0,
  }));
}

// ===== 키보드 =====
const keys = {};
let jumpPressed = false;
let started = false;
let ready = false;
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (!ready) return;
  if (!started) {                       // 브라우저는 키를 한 번 눌러야 소리를 내게 해 줌
    started = true;
    sounds.bgm.play().catch(() => {});
    return;
  }
  keys[e.code] = true;
  if (e.code === 'Space' && !e.repeat) jumpPressed = true;
  if (e.code === 'KeyR') resetGame();
});
addEventListener('keyup', e => { keys[e.code] = false; });

// ===== 움직이기 =====
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const knightBox = () => ({ x: knight.x, y: knight.y, w: KB.w, h: KB.h });
const slimeBox = s => ({ x: s.x - 5, y: s.y - 9, w: 10, h: 9 });    // 몸(12×10)보다 살짝 작게 잡아 억울하지 않게

function updateKnight(dt) {
  const k = knight;
  if (k.hurt > 0) k.hurt -= dt;
  if (k.knock > 0) {
    k.knock -= dt;                      // 부딪힌 직후 잠깐은 뒤로 밀려남
  } else if (state === 'play') {
    k.vx = ((keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0)) * SPEED;
    if (k.vx !== 0) k.face = k.vx > 0 ? 1 : -1;
  } else {
    k.vx = 0;                           // 쓰러진 뒤에는 움직이지 않음
  }
  if (jumpPressed && k.onGround && state === 'play') {
    k.vy = JUMP;
    playSfx('jump');
  }
  jumpPressed = false;

  k.vy = Math.min(k.vy + GRAVITY * dt, MAX_FALL);
  k.x = Math.max(0, Math.min(WORLD_W - KB.w, k.x + k.vx * dt));
  const prevBottom = k.y + KB.h;
  k.y += k.vy * dt;
  k.onGround = false;
  if (k.vy >= 0) {
    const bottom = k.y + KB.h;
    let landY = bottom >= GROUND_TOP ? GROUND_TOP : null;
    for (const pl of PLATFORMS) {       // 발판은 위에서 내려올 때만 밟힘
      if (prevBottom <= pl.y && bottom >= pl.y && k.x + KB.w > pl.x && k.x < pl.x + pl.w) landY = pl.y;
    }
    if (landY !== null) {
      k.y = landY - KB.h;
      k.vy = 0;
      k.onGround = true;
    }
  }
}

function setSlimeAnim(s, name) {
  if (s.anim !== name) { s.anim = name; s.animTime = 0; }
}

function updateSlime(s, dt) {
  s.animTime += dt;
  if (state === 'won') { setSlimeAnim(s, 'death'); return; }
  if (state === 'over') { setSlimeAnim(s, 'wave'); return; }
  if (s.waveTime > 0) {                 // 기사를 맞힌 슬라임은 잠깐 손을 흔듦
    s.waveTime -= dt;
    setSlimeAnim(s, 'wave');
    return;
  }
  s.cooldown -= dt;

  if (s.anim === 'attack') {            // 빨강: 공격 동작 중간에 기사 쪽으로 달려듦
    const f = Math.floor(s.animTime * SLIME_ANIMS.attack.fps);
    if (f >= 4 && f <= 8) s.x = Math.max(s.minX, Math.min(s.maxX, s.x + s.dir * 90 * dt));
    if (s.animTime >= SLIME_ANIMS.attack.frames / SLIME_ANIMS.attack.fps) {
      setSlimeAnim(s, 'walk');
      s.cooldown = 1.2;
    }
    return;
  }
  const kx = knight.x + KB.w / 2;
  if (s.charge && s.cooldown <= 0 && knight.safe <= 0 && Math.abs(kx - s.x) < 50 && knight.y + KB.h > GROUND_TOP - 24) {
    s.dir = kx > s.x ? 1 : -1;
    setSlimeAnim(s, 'attack');
    return;
  }

  s.x += s.dir * s.speed * dt;
  if (s.x < s.minX) { s.x = s.minX; s.dir = 1; }
  if (s.x > s.maxX) { s.x = s.maxX; s.dir = -1; }

  if (s.hop) {                          // 노랑: 가끔 통통 뜀
    s.hopTimer -= dt;
    if (s.hopTimer <= 0 && s.y >= GROUND_TOP) { s.vy = -170; s.hopTimer = 1.4; }
    s.vy += GRAVITY * dt;
    s.y = Math.min(GROUND_TOP, s.y + s.vy * dt);
    setSlimeAnim(s, s.y < GROUND_TOP ? 'idle' : 'walk');
  } else {
    setSlimeAnim(s, 'walk');
  }
}

// 기사 동작 고르기: 쓰러짐 > 피격 > 점프/떨어짐 > 달리기/대기
function setKnightAnim(name) {
  if (knight.anim !== name) { knight.anim = name; knight.animTime = 0; }
}
function updateKnightAnim(dt) {
  const k = knight;
  k.animTime += dt;
  const hitPlaying = k.anim === 'hit' && k.animTime < HERO_ANIMS.hit.frames / HERO_ANIMS.hit.fps;
  if (state === 'over') setKnightAnim('death');
  else if (k.knock > 0 || hitPlaying) setKnightAnim('hit');
  else if (!k.onGround) setKnightAnim(k.vy < 0 ? 'jump' : 'fall');
  else setKnightAnim(k.vx !== 0 && state === 'play' ? 'run' : 'idle');
}

function update(dt) {
  for (const s of slimes) updateSlime(s, dt);
  if (state === 'play') updatePlay(dt);
  else if (state === 'over') updateKnight(dt);   // 쓰러질 때 공중이면 땅까지 떨어짐
  updateKnightAnim(dt);
}

function updatePlay(dt) {
  playTime += dt;
  if (knight.safe > 0) knight.safe -= dt;
  updateKnight(dt);

  const kb = knightBox();
  for (const c of coins) {
    if (!c.taken && overlap(kb, { x: c.x - 4, y: c.y - 4, w: 8, h: 8 })) {
      c.taken = true;
      playSfx('coin');
    }
  }
  if (coins.every(c => c.taken)) { state = 'won'; return; }

  if (knight.hurt <= 0 && knight.safe <= 0) {
    for (const s of slimes) {
      if (!overlap(kb, slimeBox(s))) continue;
      knight.lives--;
      knight.hurt = 1.5;                // 1.5초 동안 깜빡이며 다시 안 맞음
      knight.knock = 0.25;
      knight.vx = (knight.x + KB.w / 2 < s.x ? -1 : 1) * 130;
      knight.vy = -180;
      s.waveTime = 1;
      if (knight.lives <= 0) { state = 'over'; knight.hurt = 0; }   // 쓰러지는 모습은 깜빡이지 않게
      break;
    }
  }
}

// ===== 그리기 =====
function animFrame(a, t) {
  const f = Math.floor(t * a.fps);
  return a.loop ? f % a.frames : Math.min(f, a.frames - 1);   // 한 번만 하는 동작은 마지막 장면에서 멈춤
}
const slimeFrame = s => animFrame(SLIME_ANIMS[s.anim], s.animTime);
function drawText(text, x, y, size, color = '#fff', align = 'left') {
  ctx.font = `bold ${size}px "Malgun Gothic", sans-serif`;
  ctx.textAlign = align;
  ctx.lineWidth = 5;
  ctx.strokeStyle = '#14201a';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

let cam = 0, camY = H - VIEW_H;
function draw(time) {
  cam = Math.max(0, Math.min(WORLD_W - VIEW_W, knight.x + KB.w / 2 - VIEW_W / 2));   // 기사를 화면 가운데에 두고 따라감
  // 위아래는 기사가 발판에 올라가면 부드럽게 따라 올라감 (점프할 때마다 출렁이지 않게 조금씩)
  const targetY = Math.max(0, Math.min(H - VIEW_H, knight.y + KB.h - VIEW_H * 0.7));
  camY += (targetY - camY) * 0.08;
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingEnabled = false;     // 픽셀 그림이 흐려지지 않게 (최근접 필터)

  // 배경 두 겹: 뒤 레이어일수록 천천히 지나감 (패럴랙스)
  for (const layer of PARALLAX) {
    const off = -((cam * layer.speed) % layer.w);
    for (let x = off; x < VIEW_W; x += layer.w) ctx.drawImage(images[layer.key], Math.round(x), -Math.round(camY));
  }

  ctx.save();
  ctx.translate(-Math.round(cam), -Math.round(camY));
  ctx.drawImage(worldCanvas, 0, 0);

  // 금화: 옆으로 좁아졌다 넓어졌다 하며 도는 것처럼 보이게
  coins.forEach((c, i) => {
    if (c.taken) return;
    const w = Math.max(2, Math.round(8 * Math.abs(Math.cos(time / 300 + i))));
    ctx.drawImage(coinImage, Math.round(c.x - w / 2), Math.round(c.y - 4), w, 8);
  });

  // 슬라임 그림은 왼쪽을 보고 있어서 오른쪽으로 갈 때 뒤집음
  for (const s of slimes) {
    const img = images[`${s.color}-${s.anim}`];
    const x = Math.round(s.x), y = Math.round(s.y);
    ctx.save();
    ctx.translate(x, y - SLIME_FRAME + 1);
    if (s.dir > 0) ctx.scale(-1, 1);
    ctx.drawImage(img, slimeFrame(s) * SLIME_FRAME, 0, SLIME_FRAME, SLIME_FRAME, -SLIME_FRAME / 2, 0, SLIME_FRAME, SLIME_FRAME);
    ctx.restore();
  }

  // 기사: 발밑 가운데를 몸 아래에 맞춰 그림. 왼쪽으로 갈 때 뒤집음. 부딪힌 뒤에는 깜빡임
  if (!(knight.hurt > 0 && Math.floor(knight.hurt * 10) % 2 === 0)) {
    const f = animFrame(HERO_ANIMS[knight.anim], knight.animTime);
    ctx.save();
    ctx.translate(Math.round(knight.x + KB.w / 2), Math.round(knight.y + KB.h));
    ctx.scale(knight.face * HERO_SIZE, HERO_SIZE);
    ctx.drawImage(images[`hero-${knight.anim}`], f * HERO_FW, 0, HERO_FW, HERO_FH,
                  -HERO_FOOT_X, -HERO_FOOT_Y, HERO_FW, HERO_FH);
    ctx.restore();
  }
  ctx.restore();

  // 글자는 2배 하지 않은 원래 크기로 그려야 또렷함
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const got = coins.filter(c => c.taken).length;
  drawText(`금화 ${got} / ${coins.length}`, 20, 40, 26, '#ffd23f');
  drawText('♥'.repeat(knight.lives) + '♡'.repeat(3 - knight.lives), 20, 76, 26, '#ff6b6b');
  drawText(`${playTime.toFixed(1)}초`, canvas.width - 20, 40, 26, '#fff', 'right');
  soundErrors.forEach((src, i) => drawText(`소리를 못 불러왔어요: ${src}`, 20, 112 + i * 26, 18, '#ff8080'));

  if (!started) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawText('숲속 금화 모으기', canvas.width / 2, 220, 48, '#ffd23f', 'center');
    drawText('슬라임을 피해서 금화를 모두 모으세요', canvas.width / 2, 275, 22, '#fff', 'center');
    drawText('아무 키나 누르면 시작 (배경음악이 함께 나와요)', canvas.width / 2, 315, 20, '#ccc', 'center');
  } else if (state === 'won') {
    drawText('금화를 다 모았어요!', canvas.width / 2, 230, 44, '#ffd23f', 'center');
    drawText(`걸린 시간 ${playTime.toFixed(1)}초 · R 을 누르면 처음부터`, canvas.width / 2, 280, 22, '#fff', 'center');
  } else if (state === 'over') {
    drawText('하트를 다 잃었어요', canvas.width / 2, 230, 44, '#ff6b6b', 'center');
    drawText(`모은 금화 ${got}개 · R 을 누르면 처음부터`, canvas.width / 2, 280, 22, '#fff', 'center');
  }
}

// ===== 시작 =====
let last = 0;
function loop(time) {
  const dt = Math.min((time - last) / 1000, 1 / 30);
  last = time;
  if (started) update(dt);
  else {                                           // 시작 전에도 슬라임과 기사는 꿈틀거림
    for (const s of slimes) s.animTime += dt;
    knight.animTime += dt;
  }
  draw(time);
  requestAnimationFrame(loop);
}

ctx.font = 'bold 24px "Malgun Gothic", sans-serif';
ctx.fillStyle = '#fff';
ctx.fillText('불러오는 중...', 20, 40);

loadAllImages()
  .then(() => {
    buildWorldCanvas();
    resetGame();
    ready = true;
    requestAnimationFrame(t => { last = t; loop(t); });
  })
  .catch(src => {
    ctx.fillStyle = '#ff8080';
    ctx.fillText(`그림을 못 불러왔어요: ${src}`, 20, 80);
  });
</script>
</body>
</html>
